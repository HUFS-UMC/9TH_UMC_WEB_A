<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Outline Layout</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="container">
      <!-- TOP -->
      <div class="header cell">
        <span>Penguin House</span>
      </div>
      <div class="menu cell">
        <span>Home</span>
        <span>About</span>
        <span>Skill</span>
      </div>

      <!-- HERO -->
      <div class="hero cell">
        <span>No pain, No gain</span>
      </div>

      <!-- CONTENT -->
      <div class="main cell">안녕하세요,<br> 이곳은 <span>감정</span>이 살아숨쉬는 곳입니다.</div>
      <div class="gap cell"></div>
      <!-- 가운데 '공백' -->
      <div class="image cell"><img src="./펭수.png" alt="펭수사진" /></div>
      <div class="extra cell">
        <ul>
          <li>밥또먹기</li>
          <li>밥먹기</li>
          <li>잠자기</li>
        </ul>
      </div>

      <!-- BANNER -->

      <div class="banner cell">
        <p>@2025 My website. All rights reserved</p>
      </div>
    </main>
  </body>
</html>
