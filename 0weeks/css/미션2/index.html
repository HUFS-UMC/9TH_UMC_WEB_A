<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>
    <style>
      body {
        background-color: black;
        font-size: 10px;
        margin: 0;
        color: white;
        font-family: sans-serif;
      }

      .header {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 60px;
        background: #111;
      }

      .container {
        display: flex;
        flex-direction: row;
        gap: 20px;
      }

      .container span {
        cursor: pointer;
        transition: color 0.2s;
      }

      .container span:hover {
        color: #34d399;
      }

      .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        margin-left: auto;
        margin-right: 20px;
        cursor: pointer;
      }

      .hamburger div {
        width: 25px;
        height: 2px;
        background: white;
      }

      .sidebar {
        position: fixed;
        top: 0;
        right: -250px;
        width: 200px;
        height: 100%;
        background: #222;
        display: flex;
        flex-direction: column;
        padding: 20px;
        transition: right 0.3s ease;
      }

      .sidebar.open {
        right: 0;
      }

      .sidebar span {
        margin: 20px 0;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .container {
          display: none;
        }
        .hamburger {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <span>Home</span>
        <span>Projects</span>
        <span>Members</span>
        <span>FAQ</span>
      </div>

      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </header>

    <div class="sidebar" id="sidebar">
      <span>Home</span>
      <span>Projects</span>
      <span>Members</span>
      <span>FAQ</span>
    </div>

    <script>
      const hamburger = document.getElementById("hamburger");
      const sidebar = document.getElementById("sidebar");

      hamburger.addEventListener("click", () => {
        sidebar.classList.toggle("open");
      });
    </script>
  </body>
</html>
