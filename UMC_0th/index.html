<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>My Daily Plan</h1>
      <input type="text" id="todo-input" placeholder="write your plan" />
    </header>

    <main>
      <section>
        <h2>해야 할 일</h2>
        <ul id="todo-list"></ul>
      </section>

      <section>
        <h2>해낸 일</h2>
        <ul id="done-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
