<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    margin: 0;
  }

  nav {
    background: black;
    padding: 15px;
    border-radius: 50px;
    width: 500px;
    margin: 10px auto;
    position: relative;
    z-index: 100;
  }

  .menu {
    display: flex;
    justify-content: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .menu a {
    text-decoration: none;
    color: green;
    padding: 8px 16px;
    border-radius: 15px;
    font-size: 18px;
    transition: color 0.3s, background 0.3s;
  }

  .menu a.active {
    background: white;
    color: black;
  }

  .menu a:hover {
    color: gray;
  }

  .nav-toggle {
    position: absolute;
    right: 50px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 24px;
    color: white;
    cursor: pointer;
    display: none;
    z-index: 101;
    
    background: none;
    border: none;
    padding: 0;
  }

  @media screen and (max-width: 768px) {
    nav {
      width: 100%;
      border-radius: 0;
      position: relative;
      background: none;
    }

    .menu {
      flex-direction: column;
      align-items: center;
      position: fixed;
      top: 0;
      right: -250px;
      width: 250px;
      height: 100%;
      background-color: black;
      padding-top: 60px;
      transition: right 0.3s ease-in-out;
      z-index: 99;
      display: flex;
    }

    .menu li {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    .menu a {
      width: 100%;
      justify-content: center;
      color: white;
      border-radius: 0;
      padding: 15px;
    }

    .menu a:hover {
        color: gray;
    }
    
    .menu a.active {
      background: none;
      color: green;
    }

    .menu.show {
      right: 0;
    }

    .nav-toggle {
      display: block;
      color: white;
      background: black;
      border-radius: 5px;
      padding: 10px 12px;
      font-size: 18px;
    }
  }
</style>
</head>
<body>
  <nav>
    <button class="nav-toggle" id="navToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    
    <ul class="menu" id="menu">
      <li><a href="#" class="active">Main</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Members</a></li>
      <li><a href="#">FAQ</a></li>
    </ul>
  </nav>

  <script>
    const links = document.querySelectorAll('.menu a');
    const navToggle = document.getElementById('navToggle');
    const menu = document.getElementById('menu');

    links.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        if (window.innerWidth <= 768) {
          menu.classList.remove('show');
        }
      });
    });

    navToggle.addEventListener('click', () => {
      menu.classList.toggle('show');
    });
  </script>
</body>
</html>
