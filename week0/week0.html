<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .container {
      display: grid;
      grid-template-areas:
        "hd mn"
        "hr hr"
        "ma im"
        "ma ex"
        "bn bn";
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 60px 150px 1fr 1fr 60px;
      gap: 5px;
      height: 100vh;
    }

    .box {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .hd { grid-area: hd; background: red; }
    .mn { grid-area: mn; background: blue; }
    .hr { grid-area: hr; background: green; }
    .ma { grid-area: ma; background: purple; }
    .im { grid-area: im; background: yellow; color: black; }
    .ex { grid-area: ex; background: orange; }
    .bn { grid-area: bn; background: gray; }

    @media (max-width: 768px) {
      .container {
        grid-template-areas:
          "hd"
          "mn"
          "hr"
          "ma"
          "im"
          "ex"
          "bn";
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box hd">HEADER</div>
    <div class="box mn">MENU</div>
    <div class="box hr">HERO</div>
    <div class="box ma">MAIN</div>
    <div class="box im">IMAGE</div>
    <div class="box ex">EXTRA</div>
    <div class="box bn">BANNER</div>
  </div>
</body>
</html>
