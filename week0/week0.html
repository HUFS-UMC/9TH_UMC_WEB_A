<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>
  <style>
    body { margin: 0; font-family: sans-serif; }

    .wrap {
      display: grid;
      grid-template-areas:
        "hd mn mn"
        "hr hr hr"
        "ma sp im"
        "ma sp ex"
        "bn bn bn";
      grid-template-columns: 1fr 0.5fr 1fr;
      grid-template-rows: 80px 300px 250px 250px 100px;
      gap: 0;              /* 스크린샷처럼 칸 사이 여백 없음 */
      min-height: 100vh;
    }

    .box { display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }

    .hd { grid-area: hd; background: navy; }
    .mn { grid-area: mn; background: red; }
    .hr { grid-area: hr; background: steelblue; }
    .ma { grid-area: ma; background: midnightblue; }
    .im { grid-area: im; background: lightcyan; color:#000; }
    .ex { grid-area: ex; background: mediumseagreen; }
    .bn { grid-area: bn; background: gold; color:#000; }

    /* 가운데 하얀 빈 칸 */
    .sp { grid-area: sp; background: white; }

    /* 옵션: 모바일에선 1열로 */
    @media (max-width: 768px) {
      .wrap {
        grid-template-areas:
          "hd"
          "mn"
          "hr"
          "ma"
          "im"
          "ex"
          "bn";
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .sp { display:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box hd">HEADER</div>
    <div class="box mn">MENU</div>
    <div class="box hr">HERO</div>
    <div class="box ma">MAIN</div>
    <div class="sp"></div>
    <div class="box im">IMAGE</div>
    <div class="box ex">EXTRA</div>
    <div class="box bn">BANNER</div>
  </div>
</body>
</html>
